<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giao Diện Điều Khiển Thử Nghiệm</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .panel-container {
            background-color: #1a1a1a;
            border: 3px solid #00ff00;
            border-radius: 10px;
            padding: 25px;
            width: 320px;
            box-shadow: 0 0 15px #00ff00;
            text-align: center;
        }
        h2 {
            font-size: 16px;
            color: #fffb00;
            text-shadow: 0 0 5px #fffb00;
            margin-top: 0;
        }
        .divider {
            border-top: 1px dashed #555;
            margin: 15px 0;
        }
        .status-box {
            background-color: #262626;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .status-die {
            background-color: #ff3333;
            color: white;
            padding: 3px 10px;
            border-radius: 3px;
            font-weight: bold;
            box-shadow: 0 0 8px #ff3333;
        }
        .status-run {
            background-color: #00ff00;
            color: black;
            padding: 3px 10px;
            border-radius: 3px;
            font-weight: bold;
            box-shadow: 0 0 8px #00ff00;
        }
        .input-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .input-group label {
            font-size: 14px;
            color: #ccc;
        }
        .input-group input {
            background-color: #262626;
            border: 1px solid #00ff00;
            color: #fff;
            padding: 5px;
            width: 80px;
            border-radius: 4px;
            text-align: center;
        }
        .button-group {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }
        button {
            width: 48%;
            padding: 10px;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-start {
            background-color: #00cc44;
            color: white;
        }
        .btn-start:hover {
            background-color: #00ff55;
            box-shadow: 0 0 10px #00ff55;
        }
        .btn-stop {
            background-color: #cc0000;
            color: white;
        }
        button:disabled {
            background-color: #555;
            color: #aaa;
            cursor: not-allowed;
            box-shadow: none !important;
        }
        .log-box {
            font-size: 13px;
            color: #00fffa;
            text-align: left;
        }
    </style>
</head>
<body>

    <div class="panel-container">
        <h2>⚡ TOOLS NGÔ TRỌNG HIỀN ⚡</h2>
        <div class="divider"></div>

        <div class="status-box">
            <span>Trạng thái Nick:</span>
            <span id="system-status" class="status-die">DIE</span>
        </div>

        <div class="input-group">
            <label>Số lần báo cáo (Loops):</label>
            <input type="number" id="loops" value="40" min="1">
        </div>

        <div class="input-group">
            <label>Độ trễ tốc độ (ms):</label>
            <input type="number" id="delay" value="100" min="10">
        </div>

        <div class="button-group">
            <button id="btn-start" class="btn-start">BẮT ĐẦU</button>
            <button id="btn-stop" class="btn-stop" disabled>TẠM DỪNG</button>
        </div>

        <div class="divider"></div>
        <div class="log-box">
            <p>Trạng thái: <span id="log-text">Đang chờ lệnh...</span></p>
        </div>
    </div>

    <script>
        const btnStart = document.getElementById('btn-start');
        const btnStop = document.getElementById('btn-stop');
        const systemStatus = document.getElementById('system-status');
        const logText = document.getElementById('log-text');

        let isRunning = false;
        let currentLoop = 0;
        let timer = null;

        btnStart.addEventListener('click', () => {
            const totalLoops = parseInt(document.getElementById('loops').value) || 40;
            const delay = parseInt(document.getElementById('delay').value) || 100;

            isRunning = true;
            currentLoop = 0;
            
            systemStatus.textContent = "LIVE";
            systemStatus.className = "status-run";
            btnStart.disabled = true;
            btnStop.disabled = false;

            function runSimulation() {
                if (!isRunning) return;

                if (currentLoop < totalLoops) {
                    currentLoop++;
                    logText.textContent = `🌀 Đang quét FB... (${currentLoop}/${totalLoops})`;
                    timer = setTimeout(runSimulation, delay);
                } else {
                    stopSimulation("Hoàn thành quá trình quét mô phỏng!");
                }
            }

            runSimulation();
        });

        btnStop.addEventListener('click', () => {
            stopSimulation("TẠM DỪNG");
        });

        function stopSimulation(message) {
            isRunning = false;
            clearTimeout(timer);
            
            systemStatus.textContent = "DIE";
            systemStatus.className = "status-die";
            btnStart.disabled = false;
            btnStop.disabled = true;
            logText.textContent = message;
        }
    </script>
</body>
</html>
